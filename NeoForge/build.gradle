import se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'io.github.goooler.shadow'
    id 'se.bjurr.gitchangelog.git-changelog-gradle-plugin'
}


def modLoader = "${project.name}".toUpperCase()
def actualVersion = version
version = "${version}-${modLoader}"

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = mappings_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        clientData {
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            clientData()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-neoforge", version: "${whitenoise_version}"
    jarJar group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-neoforge", version: "${whitenoise_version}"

    implementation "io.wispforest:accessories-neoforge:${accessories_version}+${minecraft_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    implementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    //compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}")
    //compileOnly "curse.maven:ryoamiclights-913587:${ryoamiclights_version}"

    //runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    //runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    //runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    //runtimeOnly "curse.maven:charmofundying-316873:3927421"
    //runtimeOnly "curse.maven:biomemakeover-567709:3942516"
    //runtimeOnly "curse.maven:sodium-394468:${sodium_neoforge_version}" // Required by Dynamic Lights
    //runtimeOnly "curse.maven:sodium_dynamic_lights-551736:${sdl_neoforge_version}"
    //runtimeOnly "curse.maven:obsidianui-684718:${obsidianui_version}" // For ryoamiclights
    //runtimeOnly "curse.maven:ryoamiclights-913587:${ryoamiclights_version}"
    /*
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_neoforge_version}" // For Ars Nouveau
    runtimeOnly "curse.maven:terrablender-940057:${terrablender_neoforge_version}" // For Ars Nouvea
    runtimeOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}") {
        exclude(group: 'com.github.glitchfiend')
    }
    */
    //runtimeOnly "curse.maven:lucent-493280:${lucent_version}"
    //runtimeOnly "curse.maven:dynamic_lights-227874:${dynamic_lights_forge_version}"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

shadowJar {
    archiveClassifier = ''
}

tasks.register('changelog', GitChangelogTask) {
    file.set(new File(project(":").projectDir.toString() + '/build/libs/changelog.txt'));
    templateContent.set(file(project(":").projectDir.toString() + '/files/templates/changelog.mustache').getText('UTF-8'));
    toRevision.set('HEAD');
    fromRevision.set("${minecraft_version}-${last_mod_version}");
}

def updates = tasks.register("generateUpdates", Copy) {
    it.outputs.upToDateWhen {
        false
    }

    it.from("../files/templates/") {
        include 'updates.json'
        expand 'version': actualVersion, 'minecraft_version': minecraft_version
    }

    it.into '../files/'
}

tasks.generateUpdates.mustRunAfter('jar', 'sourcesJar')

tasks.build.dependsOn('changelog', 'generateUpdates')

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/NeoForge/build/libs/${archivesBaseName}-${version}.jar"
def display_name = "${project.name} ${minecraft_version}-${version}"
def display_version = "${minecraft_version}-${version}"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    displayName = "${display_name}"
    version = "${display_version}"
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.add('neoforge')
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty('ccCurseApiKey')) {
        curseforge {
            accessToken = project.ccCurseApiKey
            projectId = ccCurseId
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('accessories')
            optional('biome-makeover-forge')
        }
    }
    if (project.hasProperty('ccModrinthId')) {
        modrinth {
            accessToken = project.modrinthKey
            projectId = project.ccModrinthId
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('accessories')
            optional('biome-makeover')
        }
    }
}
