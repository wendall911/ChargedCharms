plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

def identifier = "${mod_id}-${minecraft_version}-neoforge"
def modLoader = "${project.name}".toUpperCase()
def actualVersion = version
version = "${version}-${modLoader}"

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // Nerds aren't discord bros and I'm a nerd. Disabling owo stupidity
            systemProperty("owo.debug", "false")
        }
        server {
            server()
        }
        clientData {
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            clientData()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-neoforge", version: "${whitenoise_version}"
    jarJar group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-neoforge", version: "${whitenoise_version}"

    // For some reason the maven dependencies cause crashes. I'll wait and see if it gets fixed.
    //implementation "io.wispforest:accessories-neoforge:${accessories_version}+${minecraft_version}"
    runtimeOnly "curse.maven:owo-532610:7104510"
    implementation "curse.maven:accessories-938917:7115209"

    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    implementation "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"

    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    //compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}")
    //compileOnly "curse.maven:ryoamiclights-913587:${ryoamiclights_version}"

    //runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    //runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    //runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    //runtimeOnly "curse.maven:charmofundying-316873:3927421"
    //runtimeOnly "curse.maven:biomemakeover-567709:3942516"
    /*
     * Sodium is suddenly just a flaming bag of dogshit in development environments.
     * 1.21.8 version crashes on world load
     * 1.21.10 outright crashes on game load
     * Also, if any devs actually read my stupid comments. This isn't just the curse maven
     * version, this crashes from the official repos as well. Just poorly managed for multiloader.
     * I'm going to guess it is the forgified fabric api... solving problems wrong and crashing one mod at a time.
     */
    //runtimeOnly "curse.maven:sodium-394468:${sodium_neoforge_version}"
    //runtimeOnly "curse.maven:obsidianui-684718:${obsidianui_version}" // For ryoamiclights
    //runtimeOnly "curse.maven:ryoamiclights-913587:${ryoamiclights_version}"
    /*
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_neoforge_version}" // For Ars Nouveau
    runtimeOnly "curse.maven:terrablender-940057:${terrablender_neoforge_version}" // For Ars Nouvea
    runtimeOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}") {
        exclude(group: 'com.github.glitchfiend')
    }
    */
    //runtimeOnly "curse.maven:lucent-493280:${lucent_version}"
    runtimeOnly "curse.maven:lambdynamiclights-393442:${dynamiclights_neoforge_version}"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/NeoForge/build/libs/${identifier}-${version}.jar"
def display_name = "${project.name} ${minecraft_version}-${version}"
def display_version = "${minecraft_version}-${version}"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    displayName = "${display_name}"
    version = "${display_version}"
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.add('neoforge')
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty("${curseforge_api_key_prop}")) {
        curseforge {
            accessToken = project.property("${curseforge_api_key_prop}")
            projectId = "${curseforge_id}"
            projectSlug = "${curseforge_slug}"
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('accessories')
            optional('actually-harvest')
            optional('betterdays')
            optional('creeper-fireworks')
            optional('homeostatic')
            optional('homeostatic-seasons')
            optional('magical-psi-revival')
            optional('mobchampions')
            optional('simpletextoverlay')
            optional('ready-player-fun')
            optional('survivalist-essentials')
            optional('tinkersurvival')
            optional('biome-makeover-forge')
        }
    }
    if (project.hasProperty("${modrinth_api_key_prop}")) {
        modrinth {
            accessToken = project.property("${modrinth_api_key_prop}")
            projectId = "${modrinth_id}"
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('accessories')
            optional('actually-harvest')
            optional('betterdays')
            optional('creeper-fireworks-mod')
            optional('homeostatic')
            optional('homeostatic-seasons')
            optional('magical-psi-revival')
            optional('mobchampions')
            optional('simpletextoverlay')
            optional('ready-player-fun')
            optional('survivalist-essentials')
            optional('tinkersurvival')
            optional('biome-makeover')
        }
    }
    if (project.hasProperty("${discord_webhook_prop}")) {
        discord {
            webhookUrl = project.property("${discord_webhook_prop}")
            dryRunWebhookUrl = project.property("${discord_dryrun_webhook_prop}")
            username = "${mod_author}"
            content = changelog.map {
                "# A new version of ${mod_display_name} for NeoForge ${minecraft_version} has been released! \n" + it
            }
        }
    }
}
